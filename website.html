<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>ML Final Project — User Input</title>
        <style>
            :root{font-family:Segoe UI, Roboto, Arial, sans-serif;color:#222}
            body{margin:0;padding:24px;background:#f7f8fb}
            main{max-width:820px;margin:18px auto;padding:20px;background:#fff;border-radius:8px;box-shadow:0 6px 20px rgba(20,30,60,0.08)}
            h1{margin-top:0;font-size:20px}
            form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
            label{display:flex;flex-direction:column;font-size:13px}
            input[type="text"],input[type="email"],input[type="number"],select,textarea{padding:8px;border:1px solid #d6dbe6;border-radius:6px;font-size:14px}
            textarea{grid-column:1 / -1;min-height:100px;resize:vertical}
            .full{grid-column:1 / -1}
            .controls{display:flex;gap:8px;align-items:center;justify-content:flex-end;grid-column:1 / -1}
            button{background:#0b66ff;border:none;color:#fff;padding:10px 14px;border-radius:6px;cursor:pointer}
            button.secondary{background:#e6eefc;color:#0b66ff}
            #result{margin-top:16px;padding:12px;background:#fbfcff;border-radius:6px;border:1px solid #e6eefc}
            pre{white-space:pre-wrap;margin:0;font-size:13px}
            @media (max-width:640px){form{grid-template-columns:1fr}}
        </style>
    </head>
    <body>
        <main>
            <h1>User input demo</h1>
            <p>Use the form below to enter sample input. This is client-side only and shows the captured values.</p>

            <form id="userForm">

                <label>
                    Age
                    <input type="number" name="Age" min="0" />
                </label>
                <label>
                    Sex
                    <select name = "Sex">
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                    </select>
                </label>
                <label>
                    Resting Blood Pressure
                    <input type = "number" name = "RestingBP" min = "0">
                </label>

                <label>
                    Cholestrol
                    <input type = "number" name = "Cholesterol" min = "0">
                </label>

                <label>
                    Fasting Blood Sugar
                    <select name="FastingBS">
                        <option value=1>Greater than 120 mg/dl</option>
                        <option value=0 >Otherwise</option>
                    </select>
                </label>

                <label>
                    What type of chest pain are you experiencing?
                    <select name = "ChestPainType">
                        <option value = "TA">Typical Angina</option>
                        <option value = "ATA">Atypial Angina</option>
                        <option value = "NAP">Non Anginal Pain</option>
                        <option value = "ASY">Asympomatic</option>
                    </select>
                </label>

                <label>
                    <select name = "RestingECG">
                        <option value = "Normal">Normal Resting ECG</option>
                        <option value = "ST"> ST-T wave abnormality (T wave inversions and/or ST elevation or depression of > 0.05 mV)</option>
                        <option value = "LVH">probable or definite left ventricular hypertrophy</option>
                    </select>
                </label>
                <label>
                    Please enter your heart rate in (If it is under 60 or over 202 please go see a doctor immediately)
                    <input type = "number" name = "MaxHR" min = "60" max = "202"/>
                </label>


                <label>
                    Do you experience Exercise Induced Angina?
                    <select name = "ExerciseAngina">
                        <option value = "Y">Yes</option>
                        <option value = "N">No</option>
                    </select>
                </label>

                <label>
                    What is your oldpeak?
                    <input type = "number" name = 'Oldpeak'></select>
                </label>

                <label>
                    ST Slope slope of peak exercise?
                    <select name = "ST_Slope">
                        <option value = "Up">Up sloping</option>
                        <option value = "Flat">Flat / No slope</option>
                        <optgroup value = "Down">Down Sloping</optgroup>
                    </select>
                </label>

                <div class="controls">
                    <button type="button" class="secondary" id="clearBtn">Clear</button>
                    <button type="submit">Submit</button>
                </div>
            </form>

            <section id="result" aria-live="polite"></section>
        </main>

        <script>
            // Handle form submission client-side and display captured values.
            const form = document.getElementById('userForm');
            const result = document.getElementById('result');
            const clearBtn = document.getElementById('clearBtn');

            form.addEventListener('submit', e => {
                e.preventDefault();
                const fd = new FormData(form);
                const out = {};
                fd.forEach((value, key) => {
                    // For file inputs, value will be a File object — handle separately below
                    if (value instanceof File) return;
                    if (out[key] !== undefined) {
                        // convert to array if multiple values exist for same key
                        if (!Array.isArray(out[key])) out[key] = [out[key]];
                        out[key].push(value);
                    } else {
                        out[key] = value;
                    }
            })
            var final_data_2 
            const final_data = fetch("http://127.0.0.1:5000/parse",{method: 'POST',headers: {'Content-type': 'application/json'},body: JSON.stringify(out)})
            .then(response => 
            response.json()).then(data => {final_data_2 = data;
                result.innerHTML = '<strong>Captured values</strong><pre>' + JSON.stringify(final_data_2,null,2)+ '</pre>';
            });
            console.log(typeof(final_data))
        }
            );

            clearBtn.addEventListener('click', () => {

                form.reset();
                result.innerHTML = '';
            });
        </script>
    </body>
</html>
